# Run `shopify app config link` to replace client_id with your app's real one.
client_id = "REPLACE_WITH_YOUR_CLIENT_ID"
name = "Virtual Outfit Builder"
application_url = "https://shopify.dev/apps/default-app-home"
embedded = true

[access_scopes]
# Needed to create the automatic "outfit bundle" discount backed by the discount function.
scopes = "write_discounts"

[auth]
redirect_urls = ["https://shopify.dev/apps/default-app-home/api/auth"]

[webhooks]
api_version = "2025-07"

[build]
include_config_on_deploy = true
